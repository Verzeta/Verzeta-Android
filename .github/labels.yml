#
# Canonical label set, synced to GitHub by .github/workflows/labels.yml on push
# to main. The issue forms and requirement workflows reference these names.

# --- Type -------------------------------------------------------------------
- name: "bug"
  color: "d73a4a"
  description: "A reproducible defect"
- name: "enhancement"
  color: "a2eeef"
  description: "Feature request or improvement"
- name: "documentation"
  color: "0075ca"
  description: "Docs: user guide, README, or code comments"
- name: "question"
  color: "d876e3"
  description: "A usage question (prefer Discussions)"

# --- Triage / status --------------------------------------------------------
- name: "needs-triage"
  color: "fbca04"
  description: "Awaiting maintainer triage"
- name: "needs-info"
  color: "e99695"
  description: "Missing logcat trace or reproduction steps"
- name: "needs-requirements"
  color: "b60205"
  description: "PR does not meet the contribution requirements"
- name: "requirements-met"
  color: "0e8a16"
  description: "PR passes the automated requirement checks"
- name: "stale"
  color: "cccccc"
  description: "Inactive and non-compliant; scheduled for closing"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported elsewhere"
- name: "wontfix"
  color: "ffffff"
  description: "Out of scope or will not be actioned"
- name: "good first issue"
  color: "7057ff"
  description: "A good entry point for new contributors"
- name: "help wanted"
  color: "008672"
  description: "Maintainer would welcome a contribution here"

# --- Area -------------------------------------------------------------------
- name: "area: ui"
  color: "5319e7"
  description: "Compose UI and screens"
- name: "area: wire-remote"
  color: "0052cc"
  description: "Wire protocol, pairing, remote client"
- name: "area: data-storage"
  color: "1d76db"
  description: "Data models, storage, notifications"
- name: "area: build-ci"
  color: "555555"
  description: "Gradle build, tooling, CI"

# --- Priority ---------------------------------------------------------------
- name: "priority: critical"
  color: "b60205"
  description: "Data loss, crash, or launch blocker"
- name: "priority: high"
  color: "d93f0b"
  description: "Important; schedule soon"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"
